<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사역 메인 보드</title>
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="사역보드">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#ffffff;overflow:hidden}
  body{padding-top:env(safe-area-inset-top,0px);box-sizing:border-box}
  iframe{display:block;width:100%;height:100%;border:0}
  .wait{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    font:16px "Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:#555;background:#ffffff;transition:opacity .3s}
  .wait img{width:72px;height:72px}
  .wait a{color:#0a7fbd;font-size:14px}
  .wait.gone{opacity:0;pointer-events:none}
</style>
</head>
<body>
<iframe id="app" title="사역 메인 보드" allow="clipboard-write"
  src="https://script.google.com/macros/s/AKfycbx4C1MnYkLW_oX8kCyTNU8FXUEGErdlBUDbYSq1bubI3rxyzv6pKng1ZFea0er9KRkOzQ/exec"></iframe>
<div class="wait" id="wait">
  <img src="icons/icon-192.png" alt="">
  <span>사역 메인 보드를 여는 중입니다</span>
  <a id="direct" href="https://script.google.com/macros/s/AKfycbx4C1MnYkLW_oX8kCyTNU8FXUEGErdlBUDbYSq1bubI3rxyzv6pKng1ZFea0er9KRkOzQ/exec" hidden>오래 걸리면 여기를 눌러 바로 여세요</a>
</div>
<script>
  var w = document.getElementById('wait');
  document.getElementById('app').addEventListener('load', function(){ w.classList.add('gone'); });
  setTimeout(function(){ document.getElementById('direct').hidden = false; }, 8000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
