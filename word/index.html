<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>말씀 자료실</title>
<meta name="description" content="장유중앙교회 주일 설교 요약본과 목장 모임 교재">
<meta name="theme-color" content="#2f4858">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="말씀자료">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html,body{margin:0;height:100%;background:#2f4858;overflow:hidden}
  body{padding-top:env(safe-area-inset-top,0px);box-sizing:border-box}
  iframe{display:block;width:100%;height:100%;border:0;background:#ffffff}
  .wait{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;
    font:17px/1.6 "Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:#5F564F;background:#ffffff;transition:opacity .3s;z-index:5}
  .wait img{width:80px;height:80px;border-radius:19px}
  .wait b{font-size:19px;color:#1f1b18}
  .wait a{color:#2f6f8f;font-size:15px}
  .wait.gone{opacity:0;pointer-events:none}
</style>
</head>
<body>
<iframe id="app" title="말씀 자료실" allow="clipboard-write" hidden></iframe>
<div class="wait" id="wait">
  <img src="icons/icon-192.png" alt="">
  <span id="msg">말씀 자료실을(를) 여는 중입니다</span>
  <a id="direct" hidden>오래 걸리면 여기를 눌러 바로 여세요</a>
</div>
<script>
(function(){
  var EXEC = 'https://script.google.com/macros/s/AKfycbyHx4unfE1uzOUzl_W2vztrzWnye8OPxsToIOzKjnTGpW0CSI7XYC0kG2qFwCEbmgsr/exec';
  var q = {}; try{ new URLSearchParams(location.search).forEach(function(v,k){ q[k]=v; }); }catch(e){}
  var url = EXEC + '';
  var f = document.getElementById('app'), w = document.getElementById('wait'), direct = document.getElementById('direct');
  direct.href = url;
  f.addEventListener('load', function(){ w.classList.add('gone'); });
  f.src = url; f.hidden = false;
  setTimeout(function(){ direct.hidden = false; }, 10000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
<script src="../shared/install.js" data-name="말씀자료" data-icon="icons/icon-192.png" data-color="#2f6f8f"></script>
</body>
</html>
